<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALSL Lambesc — Présence & Covoiturage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy: #1a2e5a; --navy-light: #243d78; --navy-deep: #0f1c3a;
  --gold: #e8a820; --gold-light: #f5c842; --gold-pale: #fef5de;
  --green: #2d9b6e; --green-pale: #e8f7f1;
  --red: #e84040; --red-pale: #fef0f0;
  --gray-50: #f8f9fb; --gray-100: #eef0f4; --gray-200: #dde1ea;
  --gray-300: #c4cad8; --gray-500: #6b7590; --gray-700: #333d5c; --gray-800: #1f2740;
  --radius-sm: 6px; --radius: 10px; --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(26,46,90,.08), 0 1px 2px rgba(26,46,90,.04);
  --transition: all .2s cubic-bezier(.4,0,.2,1);
  --font-sans: 'Inter', system-ui, sans-serif;
  --font-display: 'Sora', 'Inter', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--gray-50); color: var(--gray-800); line-height: 1.6; min-height: 100vh; }
h1,h2,h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.2; }

.topnav { background: var(--navy); color: #fff; padding: 0 1.5rem; height: 60px; display: flex; align-items: center; gap: .75rem; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
.logo-icon { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo-icon img { width: 100%; height: 100%; object-fit: cover; }
.logo-text { font-family: var(--font-display); font-weight: 800; font-size: 1rem; color: #fff; line-height: 1.1; }
.logo-sub { font-size: .68rem; color: rgba(255,255,255,.6); }

.page-wrap-narrow { max-width: 560px; margin: 0 auto; padding: 2rem 1.25rem; }

.card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--gray-100); box-shadow: var(--shadow-sm); }
.card-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--gray-100); }
.card-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.card-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--gray-100); background: var(--gray-50); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

.form-group { display: flex; flex-direction: column; gap: .4rem; }
.form-label { font-size: .82rem; font-weight: 600; color: var(--gray-700); }
.form-input, .form-select { width: 100%; padding: .65rem .9rem; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: .9rem; color: var(--gray-800); background: #fff; transition: var(--transition); outline: none; }
.form-input:focus, .form-select:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(26,46,90,.08); }

.consent-box { display: flex; align-items: flex-start; gap: .75rem; background: var(--gold-pale); padding: .875rem; border-radius: var(--radius); border-left: 3px solid var(--gold); }
.consent-box.covoit { background: var(--green-pale); border-left-color: var(--green); }
.consent-box input { margin-top: .2rem; width: 16px; height: 16px; flex-shrink: 0; }
.consent-box label { font-size: .85rem; color: var(--gray-700); cursor: pointer; }

.fieldset-covoit { border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
.fieldset-covoit legend { font-weight: 700; color: var(--navy); font-size: .9rem; padding: 0 .3rem; }

.btn-gold { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; padding: .875rem; border-radius: var(--radius); border: none; font-family: var(--font-sans); font-size: 1rem; font-weight: 700; cursor: pointer; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--navy-deep); box-shadow: 0 2px 8px rgba(232,168,32,.30); transition: var(--transition); }
.btn-gold:hover:not(:disabled) { transform: translateY(-1px); }
.btn-gold:disabled { opacity: .5; cursor: not-allowed; }

.alert-success { background: var(--green-pale); color: var(--green); border-left: 3px solid var(--green); padding: .875rem 1rem; border-radius: var(--radius); font-size: .875rem; }
.alert-error { background: var(--red-pale); color: var(--red); border-left: 3px solid var(--red); padding: .875rem 1rem; border-radius: var(--radius); font-size: .875rem; }
.hidden { display: none !important; }
</style>
</head>
<body>

<nav class="topnav">
  <div class="logo-icon"><img src="logo-alsl.jpg" alt="Logo ALSL"></div>
  <div>
    <div class="logo-text">ALSL</div>
    <div class="logo-sub">Feuille de présence & covoiturage</div>
  </div>
</nav>

<div class="page-wrap-narrow">

  <div class="card" id="form-card">
    <div class="card-header">
      <h3 style="color:var(--navy);">Présence à la réunion</h3>
    </div>
    <form id="form-presence">
      <div class="card-body">

        <div class="form-group">
          <label class="form-label">Nom</label>
          <input class="form-input" name="nom" required>
        </div>
        <div class="form-group">
          <label class="form-label">Prénom</label>
          <input class="form-input" name="prenom" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" name="email" required>
        </div>
        <div class="form-group">
          <label class="form-label">Téléphone</label>
          <input class="form-input" name="telephone">
        </div>
        <div class="form-group">
          <label class="form-label">Ville</label>
          <input class="form-input" name="ville" required>
        </div>
        <div class="form-group">
          <label class="form-label">Groupe de l'enfant (optionnel)</label>
          <select class="form-select" name="groupe_id" id="select-groupe">
            <option value="">— Sélectionner —</option>
          </select>
        </div>

        <p style="font-size:.85rem;">
          <a href="reglement.html" target="_blank" style="color:var(--navy);font-weight:600;">📄 Lire le règlement intérieur complet</a>
        </p>
        <div class="consent-box">
          <input type="checkbox" id="reglement_accepte" name="reglement_accepte" required>
          <label for="reglement_accepte">J'ai pris connaissance du règlement intérieur de l'ALSL et je l'accepte.</label>
        </div>

        <fieldset class="fieldset-covoit">
          <legend>🚗 Covoiturage (facultatif)</legend>
          <div style="display:flex;align-items:center;gap:.75rem;">
            <input type="checkbox" id="covoit-interesse" name="covoiturage_volontaire">
            <label for="covoit-interesse" style="font-size:.9rem;cursor:pointer;">Je suis intéressé(e) par le covoiturage avec d'autres parents.</label>
          </div>
          <div id="covoit-details" class="hidden" style="display:flex;flex-direction:column;gap:1rem;">
            <div class="consent-box covoit">
              <input type="checkbox" id="covoit-consentement" name="covoiturage_consentement_partage">
              <label for="covoit-consentement">J'accepte que mes coordonnées soient transmises aux parents volontaires de ma ville, à cette seule fin. Je peux retirer ce consentement à tout moment via contact@alsl-lambesc.fr.</label>
            </div>
            <div class="form-group">
              <label class="form-label">Moyen de contact préféré</label>
              <select class="form-select" name="moyen_contact_prefere">
                <option value="telephone">Téléphone</option>
                <option value="email">Email</option>
              </select>
            </div>
          </div>
        </fieldset>

        <div class="consent-box" style="background:var(--gray-50);border-left-color:var(--navy);">
          <input type="checkbox" id="benevolat_interesse" name="benevolat_interesse">
          <label for="benevolat_interesse">🙋 Je suis intéressé(e) pour donner un peu de mon temps bénévolement (stands, buvette, logistique lors des événements). L'ALSL me recontactera en amont de chaque manifestation.</label>
        </div>

        <div id="form-message"></div>
      </div>
      <div class="card-footer">
        <button type="submit" class="btn-gold" id="btn-submit">Valider</button>
      </div>
    </form>
  </div>

  <div class="card hidden" id="confirm-card" style="border-top: 4px solid var(--green);">
    <div class="card-body" style="padding:2.5rem 1.25rem;text-align:center;">
      <div style="width:64px;height:64px;background:var(--green-pale);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:1.8rem;">✅</div>
      <h2 style="color:var(--navy);">Merci !</h2>
      <p style="color:var(--gray-500);margin-top:.75rem;">Votre présence a bien été enregistrée.</p>
      <button class="btn-gold" style="margin-top:1.5rem;" onclick="location.reload()">Enregistrer une autre personne</button>
    </div>
  </div>

</div>

<script>
  const SUPABASE_URL = 'https://qenyxlvddmnqxcdomius.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_jMu9PAZpsbplwxS6sEz-VA_vARu1XL_';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function chargerGroupes() {
    const { data: groupes } = await supabaseClient
      .from('groupes')
      .select('id, nom, jour, horaire, discipline_id, disciplines ( nom )')
      .eq('actif', true)
      .order('nom');

    const select = document.getElementById('select-groupe');
    (groupes || []).forEach(g => {
      const opt = document.createElement('option');
      opt.value = g.id;
      const creneau = [g.jour, g.horaire].filter(Boolean).join(' ');
      opt.textContent = `${g.disciplines?.nom || ''} — ${g.nom}${creneau ? ' (' + creneau + ')' : ''}`;
      select.appendChild(opt);
    });
  }
  chargerGroupes();

  document.getElementById('covoit-interesse').addEventListener('change', (e) => {
    document.getElementById('covoit-details').classList.toggle('hidden', !e.target.checked);
  });

  document.getElementById('form-presence').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const now = new Date().toISOString();
    const btn = document.getElementById('btn-submit');
    const msg = document.getElementById('form-message');
    btn.disabled = true;
    btn.textContent = 'Envoi...';

    const { error } = await supabaseClient.from('prospects_parents').insert({
      nom: fd.get('nom'),
      prenom: fd.get('prenom'),
      email: fd.get('email'),
      telephone: fd.get('telephone') || null,
      ville: fd.get('ville'),
      groupe_id: fd.get('groupe_id') || null,
      reunion_date: new Date().toISOString().split('T')[0],
      reglement_accepte: fd.get('reglement_accepte') === 'on',
      date_acceptation_reglement: now,
      covoiturage_volontaire: fd.get('covoiturage_volontaire') === 'on',
      covoiturage_consentement_partage: fd.get('covoiturage_consentement_partage') === 'on',
      date_consentement_covoiturage: fd.get('covoiturage_consentement_partage') === 'on' ? now : null,
      moyen_contact_prefere: fd.get('moyen_contact_prefere') || null,
      benevolat_interesse: fd.get('benevolat_interesse') === 'on',
    });

    if (error) {
      msg.innerHTML = `<div class="alert-error">Erreur : ${error.message}</div>`;
      btn.disabled = false;
      btn.textContent = 'Valider';
    } else {
      document.getElementById('form-card').classList.add('hidden');
      document.getElementById('confirm-card').classList.remove('hidden');
    }
  });
</script>
</body>
</html>
